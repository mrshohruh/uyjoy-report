# Style examples cut from the published 2025-Q4 report (method of the old reports;
# numbers are illustrative only). The writer copies tone and structure, never sentences.
birlamchi.hududlar: >-
  2025-yil 4-choragida Oʻzbekiston birlamchi uy-joy bozorida hududlar kesimida asosan narxlarning oʻsishi kuzatildi.
  Joriy yilning 3-choragida pasayish qayd etilgan hududlarda 4-chorakka kelib biroz oʻsish yuz berdi. Bu ayniqsa,
  Qoraqalpogʻiston Respublikasi (+10.4%), Buxoro (+9.4%) va Namangan (+6.2%) hududlarida yaqqol namoyon boʻldi.
  Bozordagi narxlar oʻsishi fonida, ayrim hududlarda, aksincha, narxlarning biroz pasayishi ham kuzatildi.
birlamchi.toshkent: >-
  2025-yil 4-choragida Toshkent shahridagi birlamchi uy-joy bozorida tumanlar kesimida asosan pasayish tendensiyasi
  saqlanib qoldi. Narxlar boʻyicha eng arzon tuman Bektemir (10.32 mln. soʻm/m²), eng qimmat tumanlar Mirobod
  (17.20 mln. soʻm/m²) va Shayxontohur (16.63 mln. soʻm/m²) boʻlib qolmoqda.
birlamchi.izoh: >-
  Toshkent shahri va viloyatida kuzatilayotgan narxlarning qisman pasayishini 2020–2023-yillarda qayd etilgan yuqori
  oʻsish surʼatlarining "tabiiy korreksiya"si sifatida izohlash mumkin. Eʼtiborli jihati shundaki, yurtimizda uy-joy
  bozoridagi eʼlonlar odatda AQSH dollarida joylashtiriladi. Milliy valyutaning mustahkamlanishi uy-joy narxlarining
  dollar qiymatida oshishiga qaramasdan, milliy valyutada biroz arzonlashishiga oʻz taʼsirini koʻrsatgan.
ikkilamchi.izoh: >-
  Soʻnggi yillarda, xususan, poytaxt va yirik shaharlarda amalga oshirilgan keng koʻlamli qurilish ishlari natijasida
  bozor yangi uy-joylar bilan toʻyinishda davom etmoqda. Bu oʻz navbatida ikkilamchi bozorga ham taʼsir koʻrsatib,
  taklif hajmini oshirmoqda.
ijara.hududlar: >-
  Oʻtgan chorakdagi narxlar pasayishidan keyin joriy hisobot davrida Oʻzbekiston ijara bozorida narxlar oʻrtacha
  3.7% ga oʻsdi. Eng yuqori ijara narxlari kutilganidek Toshkent shahri (99.8 ming soʻm/m²), Toshkent viloyati
  (67.3 ming soʻm/m²) va Samarqand (62.5 ming soʻm/m²) hududlarida kuzatildi.
rentabellik.matn: >-
  Hududlar kesimida ijara rentabelligi koʻrsatkichlari bir-biridan 4% gacha farq qilmoqda. Eng yuqori yillik
  rentabellik Namangan (10.5%), Jizzax (10.4%) va Fargʻona (9.9%) viloyatlarida kuzatiladi. Rentabellik nisbatan
  pastroq boʻlgan hududlar esa Buxoro (7.0%) va Samarqand (6.6%) viloyatlari boʻldi.
indeks.matn: >-
  Respublikamizda uy-joy indeksi oxirgi yillarda oʻsish tendensiyasini qayd etmoqda. Indeks 2024-yil davomida
  biroz oʻsishda sekinlashdi, ammo 2025-yildan boshlab oʻsish tendensiyasi yana davom etmoqda.
bozor_sharhi: >-
  Taklif kengayishi: Poytaxt va yirik shaharlarda qurilish hajmining jadal surʼatlarda oʻsishi bozordagi taklifni
  sezilarli darajada oshirdi. Natijada talab va taklif oʻrtasidagi muvozanat tiklanib, bozor "tabiiy korreksiya"
  orqali oʻzini sogʻlomlashtirmoqda.
asosiy_xulosalar: >-
  Ikkilamchi bozor: Toshkent shahrida narxlar pasayishi toʻrtinchi chorakda (1.6%) uchinchi chorakka (3.9%)
  nisbatan sekinlashdi. Respublikaning aksariyat boshqa hududlarida (Qashqadaryo +9.7%, Xorazm +6.4%) umumiy
  oʻsish dinamikasi kuzatildi.
